<div class="bg-white rounded-2xl shadow w-full h-[313px]">
    <div style="border-bottom: 1px solid #ccc" class="p-6 flex items-center justify-between w-full pb-6">
        <div class="bg-[#F5F5F5] w-12 h-12 rounded-lg flex items-center justify-center">
            <img src="assets/images/manage_question/IconChatBubblesQuestion.png" alt="question" class="w-8 h-8" />
        </div>
        <div>
            <p class="text-sm text-gray-600">Câu hỏi đã trả lời</p>
            <p class="text-xl font-bold">{{ stats.answered }}</p>
        </div>
        <div>
            <p class="text-sm text-gray-600">Câu hỏi chưa trả lời</p>
            <p class="text-xl font-bold">{{ stats.unanswered }}</p>
        </div>
    </div>

    <!-- Chi tiết -->
    <div class="mt-4 space-y-2 px-4">
        <div *ngFor="let item of stats.detail" class="flex items-center justify-between text-sm p-2 rounded">
            <span>Câu hỏi {{ item.name }}</span>
            <!-- Sử dụng TUI Badge -->
            <tui-badge 
                [ngClass]="{
                    'flex items-center gap-2': true,
                    'bg-[#d4edda] text-[#155724]': item.status === 'Đã trả lời',
                    'bg-[#fff3cd] text-[#856404]': item.status === 'Đang trả lời',
                    'bg-[#e2e3e5] text-[#383d41]': item.status === 'Chưa trả lời'
                }" 
                style="padding-left: 8px;"
                size="m" 
                class="custom-1"
                [iconStart]="item.status === 'Đã trả lời' ? 'circle-check' : item.status === 'Chưa trả lời' ? 'circle-minus' : 'clock'"
            >
                {{ item.status }}
            </tui-badge>
        </div>
    </div>
</div>
